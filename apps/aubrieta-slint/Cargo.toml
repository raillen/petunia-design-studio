[package]
name = "aubrieta-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aubrieta-slint"
path = "src/main.rs"

[dependencies]
aubrieta_foundation = { path = "../../crates/aubrieta_foundation" }
aubrieta_geometry = { path = "../../crates/aubrieta_geometry" }
aubrieta_color = { path = "../../crates/aubrieta_color" }
aubrieta_document = { path = "../../crates/aubrieta_document" }
aubrieta_application = { path = "../../crates/aubrieta_application" }
aubrieta_shell = { path = "../../crates/aubrieta_shell" }
aubrieta_io = { path = "../../crates/aubrieta_io" }
slint = { version = "1.18", default-features = true }
rfd = "0.15"

[build-dependencies]
slint-build = "1.18"
lucide-slint = "1.47"
