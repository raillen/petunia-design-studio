name: CI

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.14
      - name: Create venv
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python nanobind pytest ruff pyright PySide6 jsonschema
      - name: Configure
        run: cmake --preset debug -Dnanobind_DIR=$(.venv/bin/python -m nanobind --cmake_dir)
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug && .venv/bin/python -m pytest
      - name: Lint
        run: .venv/bin/ruff check python tests tooling && .venv/bin/pyright
      - name: Schema check
        run: |
          .venv/bin/python tooling/validate_ptnd.py document examples/minimal.document.json
          .venv/bin/python tooling/validate_ptnd.py manifest examples/minimal.manifest.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv venv --python 3.14 .venv
      # Native build wiring is a template; see docs/15 for parity targets.

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv venv --python 3.14 .venv
