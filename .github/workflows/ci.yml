name: ci

on:
  push:
  pull_request:

jobs:
  pr-gate:
    name: PR fast gate (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Linux native rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake ninja-build clang libssl-dev libdbus-1-dev fonts-dejavu-core fonts-noto-core fonts-noto-cjk poppler-utils libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent PDF reader
        run: python -m pip install pypdf==6.10.0
      - name: Fast deterministic gate
        env:
          PETUNIA_CMYK_EVIDENCE_DIR: ${{ runner.temp }}/native-cmyk
        run: cargo xtask verify
      - name: Verify native PDF ink, alpha and original ICC independently
        run: python scripts/verify-native-cmyk-pdf.py "${{ runner.temp }}/native-cmyk"

  docs:
    name: Living docs (i18n parity + zero dead links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: i18n parity (zero drift, SPEC-001)
        run: node scripts/check-i18n.js
      - name: Implementation contract reference matches source
        run: node scripts/generate-implementation-reference.js --check
      - name: VitePress build (ignoreDeadLinks false)
        run: pnpm --dir docs run build
