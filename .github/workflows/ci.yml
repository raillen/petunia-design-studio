name: ci

on:
  push:
  pull_request:

jobs:
  pr-gate:
    name: PR fast gate (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fast deterministic gate
        run: cargo xtask verify
