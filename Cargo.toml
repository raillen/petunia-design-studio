[workspace]
resolver = "2"
members = [
    "crates/petunia-core",
    "crates/petunia-engine",
    "crates/petunia-render-model",
    "crates/petunia-render",
    "crates/petunia-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Petunia Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
petunia-core = { path = "crates/petunia-core" }
petunia-engine = { path = "crates/petunia-engine" }
petunia-render-model = { path = "crates/petunia-render-model" }
petunia-render = { path = "crates/petunia-render" }
petunia-ui = { path = "crates/petunia-ui" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
kurbo = { version = "0.11", features = ["serde"] }
i_overlay = "8.1"
rstar = "0.12"
palette = { version = "0.7", features = ["serde"] }
rayon = "1.10"
fontdue = "0.9"
rustybuzz = "0.20"
fontdb = "0.24"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
unicode-script = "0.5"
unicode-linebreak = "0.1"
flate2 = "1.1"
crc32fast = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
