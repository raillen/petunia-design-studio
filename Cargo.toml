[workspace]
resolver = "2"
members = [
    "crates/petunia_design_foundation",
    "crates/petunia_design_color",
    "crates/petunia_design_document",
    "crates/petunia_design_evaluation",
    "crates/petunia_design_io",
    "crates/petunia_design_render",
    "crates/petunia_design_application",
    "crates/petunia_design_geometry",
    "crates/petunia_design_text",
    "crates/petunia_design_raster",
    "crates/petunia_design_jobs",
    "crates/petunia_design_resources",
    "crates/petunia_design_platform",
    "crates/petunia_design_extension",
    "crates/petunia_design_mcp",
    "crates/petunia_design_shell",
    "crates/petunia_design_testkit",
    "apps/petunia-design-cli",
    "apps/petunia-design",
    "xtask",
]
exclude = [".opencode"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
