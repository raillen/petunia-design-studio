[workspace]
resolver = "2"
members = [
    "crates/petunia-core",
    "crates/petunia-engine",
    "crates/petunia-render-model",
    "crates/petunia-render",
    "crates/petunia-ui",
    "crates/petunia-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Petunia Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
petunia-core = { path = "crates/petunia-core" }
petunia-engine = { path = "crates/petunia-engine" }
petunia-render-model = { path = "crates/petunia-render-model" }
petunia-render = { path = "crates/petunia-render" }
petunia-ui = { path = "crates/petunia-ui" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
kurbo = { version = "0.11", features = ["serde"] }
i_overlay = "8.1"
rstar = "0.12"
palette = { version = "0.7", features = ["serde"] }
rayon = "1.10"
fontdue = "0.9"
rustybuzz = "0.20"
fontdb = "0.24"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
unicode-script = "0.5"
unicode-linebreak = "0.1"
flate2 = "1.1"
crc32fast = "1.5"
blake3 = "1"
lcms2 = { version = "6.1", features = ["static"] }
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "deterministic", "portable-dispatch"] }
wasmi_core = "2.0"
wat = "1"
qrcodegen = "1.8"
barcoders = { version = "2", default-features = false }
quircs = "0.10"
hypher = "0.1.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Test-only tooling lives in the workspace list so crates opt in with
# `workspace = true`; they are only built for crates that declare them.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"
