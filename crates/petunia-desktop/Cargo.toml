[package]
name = "petunia-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Qt/QML desktop adapter for Petunia Design Studio"

[features]
default = []
native = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[dependencies]
petunia-core.workspace = true
petunia-engine.workspace = true
petunia-render.workspace = true
petunia-render-model.workspace = true
petunia-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
image.workspace = true
base64 = "0.22"
cxx = { version = "1", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", optional = true, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true, features = ["link_qt_object_files"] }

[[bin]]
name = "petunia-studio"
path = "src/main.rs"
required-features = ["native"]
